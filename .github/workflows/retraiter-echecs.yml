name: Retraiter les parcelles échouées

# Retente UNIQUEMENT les parcelles enregistrées en échec par un traitement
# précédent (voir main.py::retraiter_echecs et ProgressStore.enregistrer_echec),
# sans les mélanger avec le reste de la commune pas encore traitée. Pensé
# pour être relancé plusieurs fois de suite (bouton "Run workflow") jusqu'à
# ce qu'il n'y ait plus aucun échec — utile en particulier après un run qui
# a rencontré un taux d'échec réseau anormal, pour rattraper précisément
# ces parcelles-là sans attendre le prochain traitement complet.
#
# Même architecture à deux dépôts que les autres workflows : ce dépôt
# (public, minutes Actions illimitées) exécute le code, le dépôt privé
# Mikajy01/walon-map-data (jeton en secret DATA_REPO_TOKEN) contient la
# vraie progression et reçoit les corrections.
on:
  workflow_dispatch:
    inputs:
      commune:
        description: "Commune dont il faut retraiter les échecs"
        required: true
        type: string
      rate_limit:
        description: "Requêtes par seconde vers le Géoportail"
        required: false
        default: "5"
        type: string
      debug:
        description: "Journalisation détaillée (DEBUG)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Même groupe que les autres workflows pour LA MÊME commune : tous
  # lisent/écrivent le même fichier de cache
  # (donnees/cache/<commune>/http_cache.sqlite3), qu'il ne faut jamais
  # laisser toucher par deux exécutions en parallèle.
  group: traiter-commune-${{ inputs.commune }}
  cancel-in-progress: false

jobs:
  retraiter:
    runs-on: ubuntu-latest
    # Beaucoup plus rapide que le traitement normal en général (le nombre
    # de parcelles en échec est censé rester faible devant le total de la
    # commune), mais marge quand même sous la limite de 6h des runners
    # hébergés GitHub au cas où.
    timeout-minutes: 340

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Récupérer les données existantes (dépôt privé séparé)
        run: |
          set -e
          git clone --depth 1 "https://x-access-token:${{ secrets.DATA_REPO_TOKEN }}@github.com/Mikajy01/walon-map-data.git" donnees
          mkdir -p donnees/cache donnees/output donnees/logs

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le retraitement des échecs
        run: |
          set -e
          ARGS=(--commune "${{ inputs.commune }}"
                --retraiter-echecs
                --rate-limit "${{ inputs.rate_limit }}"
                --template "Entête walonmap (avec colonnes en plus).xlsx"
                --cache-dir "donnees/cache/${{ inputs.commune }}"
                --logs-dir "donnees/logs/${{ inputs.commune }}"
                --output-dir "donnees/output")
          if [ "${{ inputs.debug }}" = "true" ]; then
            ARGS+=(--debug)
          fi
          python main.py "${ARGS[@]}"

      - name: Vider le cache HTTP brut avant de committer
        if: always()
        # Même raison que dans les autres workflows : le cache HTTP brut
        # (table `http_cache`) n'a de valeur que pendant l'exécution en
        # cours, le laisser s'accumuler ferait dépasser la limite de 100 Mo
        # de GitHub. `parcelle_resultats`/`parcelles_echouees` (la vraie
        # progression et le suivi des échecs) ne sont jamais touchés par ce
        # nettoyage.
        run: |
          python -c "
          import sqlite3
          from pathlib import Path
          db_path = Path('donnees/cache/${{ inputs.commune }}/http_cache.sqlite3')
          if not db_path.exists():
              print('Pas de fichier de cache (le retraitement a probablement échoué avant toute écriture) : rien à nettoyer.')
          else:
              conn = sqlite3.connect(db_path)
              table_existe = conn.execute(
                  \"SELECT 1 FROM sqlite_master WHERE type='table' AND name='http_cache'\"
              ).fetchone()
              if table_existe:
                  conn.execute('DELETE FROM http_cache')
                  conn.commit()  # VACUUM ne peut pas tourner dans une transaction ouverte
                  conn.execute('VACUUM')
                  print('Cache HTTP vidé.')
              conn.close()
          "

      - name: Committer et pousser les résultats (dépôt de données)
        if: always()
        # `if: always()` : même interrompu (timeout, erreur), toute
        # parcelle déjà corrigée jusque-là reste dans
        # donnees/cache/<commune>/http_cache.sqlite3 — on le committe quand
        # même pour ne jamais perdre le travail déjà fait (relancer ce même
        # workflow reprend exactement là où il s'est arrêté, voir
        # main.py::retraiter_echecs qui ne retente que ce qui est encore
        # dans parcelles_echouees).
        run: |
          cd donnees
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "cache/${{ inputs.commune }}/http_cache.sqlite3" \
                     "logs/${{ inputs.commune }}/" \
                     "output/${{ inputs.commune }}.xlsx" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Rien de nouveau à committer."
            exit 0
          fi
          git commit -m "Retraitement des échecs : ${{ inputs.commune }} (${{ github.run_id }})"
          for tentative in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push refusé (tentative $tentative/5), nouvel essai après rebase..."
            git pull --rebase
          done
          echo "Échec du push après 5 tentatives." >&2
          exit 1
